# ──────────────────────────────────────────────────────────────────────────────
scenario_id: SC-SAF-001
schema_version: 1
scenario_name: Fall detection
category: safety
status: rejected

detectability: rejected
claim_class: inference

trigger:
  op: detected
  args: {class_name: person}

risk_level: INFO
priority: 999
patient_facing: false
messages: {}
next_best_action: ""
