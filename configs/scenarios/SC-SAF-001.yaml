rejection_reason: >-
  No pose estimation, no keypoints, no floor plane and no motion model. A person box that becomes wide and low is someone bending, sitting on the floor, praying or exercising. This is the first capability every family will assume the product has, so the exclusion must also appear in the product surface, not only here.

sample_video_needed: false
