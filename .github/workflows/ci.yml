name: CI

on:
  push:
    branches: [main, develop, phase-5-production-dataset-engineering, "phase-6-*"]
  pull_request:
    branches: [main, develop, phase-5-production-dataset-engineering, "phase-6-*"]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dev dependencies
        # Bounded ranges match requirements.txt so CI and local tooling agree.
        run: |
          pip install --upgrade pip
          pip install "black>=24.0,<25.0" "ruff>=0.4,<1.0" "mypy>=1.10,<2.0" types-PyYAML types-requests

      - name: Run black (format check)
        run: black --check src/ scripts/ tests/

      - name: Run ruff (lint)
        run: ruff check src/ scripts/ tests/

      - name: Run mypy (type check)
        run: mypy src/
        # Whole-tree scope since Phase-6 M1. src/pipeline was excluded here on the
        # strength of a "17 errors" note from 2026-07-14 that had gone stale — it
        # measured clean when re-run, while Makefile:78 had been running `mypy src/`
        # locally the whole time, leaving local dev stricter than CI. Keeping the
        # exclusion would also have hidden errors in the very dataclasses
        # src/pipeline/__init__.py declares LOCKED.

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit + integration tests with coverage
        # Coverage floor lives in pyproject.toml ([tool.coverage.report]
        # fail_under) — ratchet it there as coverage grows.
        run: pytest tests/unit/ tests/integration/ --tb=short --cov=src --cov-report=term
